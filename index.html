<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네온 핀볼 구슬 경주 (Neon Pinball Ball Race)</title>
  
  <!-- Google Fonts (Outfit & Noto Sans KR & Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- 통합 모듈화 스타일시트 로드 -->
  <link rel="stylesheet" href="style.css?v=1.0.2">
</head>
<body>

  <!-- 핀볼 구슬 레이싱 렌더링 캔버스 -->
  <canvas id="pinball-canvas" width="1280" height="720"></canvas>

  <!-- 홀로그램 제어 패널 카드 (UI) -->
  <div class="pinball-control-panel">
    <div class="panel-row">
      <div class="panel-section-title panel-title-flush">🎯 NEON PINBALL RIVAL</div>
      <span class="badge orange badge-sm">60FPS ENGINE</span>
    </div>

    <!-- 팀원 명단 입력 -->
    <div>
      <div class="panel-row panel-row--mb2">
        <div class="panel-section-title panel-title-flush">👥 참전 팀원 명단</div>
        <button id="btn-shuffle-members" class="badge orange badge-btn">순서섞기 (0명)</button>
      </div>
      <textarea id="pinball-members" class="panel-textarea" placeholder="쉼표로 구분하여 입력"></textarea>
    </div>

    <!-- 당첨 룰 설정 라디오 버튼 -->
    <div>
      <div class="panel-section-title">⚖️ 당첨 순위 규칙 선택</div>
      <div class="rule-radio-group">
        <label class="rule-radio-item">
          <input type="radio" name="pinball-rule" value="first" checked>
          👑 선착순 당첨 (가장 먼저 들어온 사람)
        </label>
        <label class="rule-radio-item">
          <input type="radio" name="pinball-rule" value="last">
          🛡️ 후착순 당첨 (가장 오래 걸려 꼴찌로 들어온 사람)
        </label>
        <label class="rule-radio-item">
          <input type="radio" name="pinball-rule" value="specific">
          🎯 특정 순위 당첨 (지정한 순번에 들어온 사람)
        </label>
      </div>
    </div>

    <!-- 가변 인풋 셋 (당첨 인원 / 특정 순번) -->
    <div class="panel-grid-2">
      <div>
        <div class="panel-section-title" id="lbl-win-count">🎁 당첨 인원수</div>
        <input type="number" id="pinball-win-count" min="1" max="11" value="2" class="panel-input">
      </div>
      <div>
        <div class="panel-section-title panel-title-dim" id="lbl-specific-rank">🎯 당첨 골인 순번</div>
        <select id="pinball-specific-rank" disabled class="panel-input">
          <!-- 구슬 숫자에 맞춰 스크립트에서 동적 생성 -->
        </select>
      </div>
    </div>

    <!-- ❄️ Freeze Mode 토글 -->
    <div class="panel-toggle-row">
      <input type="checkbox" id="freeze-mode-toggle" checked class="panel-toggle-checkbox">
      <label for="freeze-mode-toggle" class="panel-toggle-label">❄️ FREEZE MODE</label>
      <span class="freeze-hint">?
        <div class="freeze-toast">하단 30% 구간에서 확률적으로 공이 정지됩니다.</div>
      </span>
    </div>

    <!-- 터미널 모니터 로그 -->
    <div id="pinball-terminal">> Pinball System initialized. Awaiting Launch...</div>

    <!-- 조작 버튼들 -->
    <div class="panel-grid-buttons">
      <button id="btn-pinball-launch" class="panel-btn btn-orange">⚡ LAUNCH RACING (시작)</button>
      <button id="btn-pinball-reset" class="panel-btn btn-reset">다시 세팅</button>
    </div>

    <!-- 실시간 리더보드 테이블 -->
    <div class="leaderboard-container">
      <div class="panel-section-title leaderboard-title">📊 REALTIME RACE RANK</div>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th class="leaderboard-rank">순위</th>
            <th>팀원 이름</th>
            <th class="col-time">기록(초)</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <tr>
            <td colspan="3" class="leaderboard-empty">구슬 경주 대기 중...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 공중 플로팅 당첨 팝업 모달 -->
  <div id="pinball-result-modal" class="pinball-modal">
    <div class="modal-icon">🏆☕🎉</div>
    <div class="modal-winner-badge" id="modal-rule-title">Synapse Attention Winner</div>
    <h2 class="modal-winner-names" id="pinball-winner-text">홍길동, 김철수</h2>
    <p class="modal-subtext">축하합니다!</p>
    <button id="btn-modal-close" class="panel-btn btn-reset btn-modal-close">확인 및 닫기</button>
  </div>

  <!-- ── 스크립트 파일 로드 ───────────────────────────────── -->
  <!-- 1) 정적 물리 수치 및 상수 로드 -->
  <script src="constants.js?v=1.0.2"></script>
  <!-- 2) 물리 유틸 및 장애물 충돌 해결 -->
  <script src="physics.js?v=1.0.2"></script>
  <!-- 3) 카메라 상태 및 업데이트 로직 -->
  <script src="camera.js?v=1.0.2"></script>
  <!-- 4) 물리 코어 및 드로잉 애니메이션 로드 -->
  <script src="game.js?v=1.0.2"></script>

</body>
</html>
