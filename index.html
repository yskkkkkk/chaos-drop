<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네온 핀볼 구슬 경주 (Neon Pinball Ball Race)</title>
  
  <!-- Google Fonts (Outfit & Noto Sans KR & Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- 통합 모듈화 스타일시트 로드 -->
  <link rel="stylesheet" href="style.css?v=1.0.2">
</head>
<body>

  <!-- 핀볼 구슬 레이싱 렌더링 캔버스 -->
  <canvas id="pinball-canvas" width="1280" height="720"></canvas>

  <!-- 홀로그램 제어 패널 카드 (UI) -->
  <div class="pinball-control-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div class="panel-section-title" style="margin:0;">🎯 NEON PINBALL RIVAL</div>
      <span class="badge orange" style="font-size:0.68rem; padding: 2px 8px;">60FPS ENGINE</span>
    </div>

    <!-- 팀원 명단 입력 -->
    <div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
        <div class="panel-section-title" style="margin:0;">👥 참전 팀원 명단</div>
        <button id="btn-shuffle-members" class="badge orange" style="font-size:0.65rem; border:none; cursor:pointer;">순서섞기 (0명)</button>
      </div>
      <textarea id="pinball-members" class="panel-textarea" placeholder="쉼표로 구분하여 입력"></textarea>
    </div>

    <!-- 당첨 룰 설정 라디오 버튼 -->
    <div>
      <div class="panel-section-title">⚖️ 당첨 순위 규칙 선택</div>
      <div class="rule-radio-group">
        <label class="rule-radio-item">
          <input type="radio" name="pinball-rule" value="first" checked>
          👑 선착순 당첨 (가장 먼저 들어온 사람)
        </label>
        <label class="rule-radio-item">
          <input type="radio" name="pinball-rule" value="last">
          🛡️ 후착순 당첨 (가장 오래 걸려 꼴찌로 들어온 사람)
        </label>
        <label class="rule-radio-item">
          <input type="radio" name="pinball-rule" value="specific">
          🎯 특정 순위 당첨 (지정한 순번에 들어온 사람)
        </label>
      </div>
    </div>

    <!-- 가변 인풋 셋 (당첨 인원 / 특정 순번) -->
    <div style="display: grid; grid-template-columns: 1fr 1.1fr; gap: 10px; align-items: center;">
      <div>
        <div class="panel-section-title" id="lbl-win-count">🎁 당첨 인원수</div>
        <input type="number" id="pinball-win-count" min="1" max="11" value="2" style="width:100%; padding:6px 10px; background:rgba(0,0,0,0.45); border:1px solid rgba(255,255,255,0.08); border-radius:6px; color:#fff; font-size:0.85rem; box-sizing:border-box; outline:none;">
      </div>
      <div>
        <div class="panel-section-title" id="lbl-specific-rank" style="color: rgba(255,255,255,0.25);">🎯 당첨 골인 순번</div>
        <select id="pinball-specific-rank" disabled style="width:100%; padding:6px 10px; background:rgba(0,0,0,0.45); border:1px solid rgba(255,255,255,0.08); border-radius:6px; color:#fff; font-size:0.85rem; box-sizing:border-box; outline:none; cursor:not-allowed;">
          <!-- 구슬 숫자에 맞춰 스크립트에서 동적 생성 -->
        </select>
      </div>
    </div>

    <!-- ❄️ Freeze Mode 토글 -->
    <div style="display:flex; align-items:center; gap:8px; padding:8px 10px; background:rgba(0,240,255,0.05); border:1px solid rgba(0,240,255,0.12); border-radius:8px;">
      <input type="checkbox" id="freeze-mode-toggle" checked style="accent-color:#00f0ff; width:15px; height:15px; cursor:pointer; flex-shrink:0;">
      <label for="freeze-mode-toggle" style="font-size:0.82rem; font-weight:700; color:#00f0ff; cursor:pointer; letter-spacing:0.5px; flex:1;">❄️ FREEZE MODE</label>
      <span class="freeze-hint">?
        <div class="freeze-toast">하단 30% 구간에서 확률적으로 공이 정지됩니다.</div>
      </span>
    </div>

    <!-- 터미널 모니터 로그 -->
    <div id="pinball-terminal">> Pinball System initialized. Awaiting Launch...</div>

    <!-- 조작 버튼들 -->
    <div style="display: grid; grid-template-columns: 1.8fr 1fr; gap: 10px;">
      <button id="btn-pinball-launch" class="panel-btn btn-orange">⚡ LAUNCH RACING (시작)</button>
      <button id="btn-pinball-reset" class="panel-btn btn-reset">다시 세팅</button>
    </div>

    <!-- 실시간 리더보드 테이블 -->
    <div class="leaderboard-container">
      <div class="panel-section-title" style="margin-bottom:6px; border-bottom: 1px solid rgba(255,255,255,0.04); padding-bottom:3px;">📊 REALTIME RACE RANK</div>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th class="leaderboard-rank">순위</th>
            <th>팀원 이름</th>
            <th style="text-align:right;">기록(초)</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <tr>
            <td colspan="3" style="text-align:center; color:rgba(255,255,255,0.2); padding: 20px 0;">구슬 경주 대기 중...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 공중 플로팅 당첨 팝업 모달 -->
  <div id="pinball-result-modal" class="pinball-modal">
    <div style="font-size: 2.5rem; margin-bottom: 6px;">🏆☕🎉</div>
    <div class="modal-winner-badge" id="modal-rule-title">Synapse Attention Winner</div>
    <h2 class="modal-winner-names" id="pinball-winner-text">홍길동, 김철수</h2>
    <p style="font-size: 0.95rem; color: #cbd5e1; margin-bottom: 24px; line-height: 1.45;">축하합니다!</p>
    <button id="btn-modal-close" class="panel-btn btn-reset" style="padding: 8px 30px; font-size: 0.85rem;">확인 및 닫기</button>
  </div>

  <!-- ── 스크립트 파일 로드 ───────────────────────────────── -->
  <!-- 1) 정적 물리 수치 및 상수 로드 -->
  <script src="constants.js?v=1.0.2"></script>
  <!-- 2) 물리 코어 및 드로잉 애니메이션 로드 -->
  <script src="game.js?v=1.0.2"></script>

</body>
</html>
